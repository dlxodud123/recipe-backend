#    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        use_sql_comments: true

logging.level:
  org.hibernate.SQL: debug
#  org.hibernate.type: trace

server:
  port: 8080        # Spring Boot가 8080에서 실행
  address: 0.0.0.0  # 외부에서 접속 가능

management:
  endpoints:
    web:
      exposure:
        include: health,info

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: https://api.mealhub.site/api/oauth/google/callback
#  redirect-uri: http://localhost:8080/api/oauth/google/callback

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - https://mealhub.site
      - https://www.mealhub.site

